<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>System Zabezpieczenia Tras i Biegów Masowych v2.9</title>

<!-- Stylowanie Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- Dodanie ikonek Font Awesome v6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

#panel {
    position: absolute;
    left: 0;
    top: 0;
    width: 340px;
    bottom: 0;
    background: white;
    overflow-y: auto;
    border-right: 1px solid #ccc;
    padding: 15px;
    box-sizing: border-box;
    z-index: 9999;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
}

#map {
    position: absolute;
    left: 340px;
    right: 0;
    top: 0;
    bottom: 0;
}

.section-title {
    margin-top: 15px;
    margin-bottom: 8px;
    font-size: 14px;
    text-transform: uppercase;
    color: #555;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #eee;
    padding-bottom: 3px;
}

.grid-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    margin-bottom: 10px;
}

.mode-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 11px;
    border: 1px solid #ccc;
    background: #fdfdfd;
    border-radius: 4px;
    text-align: center;
    transition: all 0.2s;
}

.mode-btn:hover {
    background: #f0f0f0;
}

.mode-btn.active {
    background: #343a40;
    border-color: #343a40;
    color: white;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
}

/* Graficzne ikony na mapie */
.custom-marker-icon {
    display: flex !important;
    align-items: center;
    justify-content: center;
    width: 26px !important;
    height: 26px !important;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    background-color: #fff;
    overflow: hidden;
    color: white;
    font-size: 11px;
    text-align: center;
    cursor: grab;
    transition: transform 0.1s;
}
.custom-marker-icon:active {
    cursor: grabbing;
    transform: scale(1.2);
}
.custom-marker-icon svg {
    width: 16px;
    height: 16px;
    display: block;
}

/* Mała odznaka typu w panelu i popupach */
.type-badge {
    display: inline-flex !important;
    width: 20px !important;
    height: 20px !important;
    margin-right: 5px;
    vertical-align: middle;
    cursor: default !important;
    box-shadow: none;
    flex-shrink: 0;
}
.type-badge:active { transform: none; }
.type-badge svg { width: 12px; height: 12px; }

.icon-wolontariusz { border: 2px solid #007bff !important; }
.icon-lider        { border: 2px solid #dc3545 !important; }
.icon-ochrona      { border: 2px solid #ffc107 !important; }
.icon-ruchem       { border: 2px solid #e84824 !important; }
.icon-medyczny     { background: #28a745; }
.icon-ploty        { background: #343a40; border-color: #f8f9fa; }
.icon-toaleta      { background: #6f42c1; }
.icon-zywieniowy   { border: 2px solid #007bff !important; }
.icon-sedzia       { background: #e0a800; }
.icon-sluza        { border: 2px solid #8B0000 !important; }

.btn-ctrl {
    width: 100%;
    padding: 8px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid #ccc;
    margin-bottom: 5px;
    font-size: 12px;
}

.btn-main { background: #28a745; color: white; border: none; }
.btn-danger { background: #dc3545; color: white; border: none; }
.btn-secondary { background: #6c757d; color: white; border: none; }

.gpx-route-box {
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 10px;
}
.gpx-input-row {
    margin-bottom: 8px;
    font-size: 12px;
}
.gpx-input-row label {
    display: block;
    font-weight: bold;
    margin-bottom: 2px;
}

.filter-item {
    display: flex;
    align-items: center;
    font-size: 12px;
    margin-bottom: 4px;
}

.filter-item input {
    margin-right: 6px;
}

.stat-table {
    width: 100%;
    font-size: 12px;
    border-collapse: collapse;
    margin-top: 5px;
}

.stat-table th, .stat-table td {
    border: 1px solid #eee;
    padding: 4px;
    text-align: left;
}

.stat-table th { background: #f8f9fa; }

.search-box {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.pointItem {
    border: 1px solid #ddd;
    margin-bottom: 6px;
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
    background: #fff;
    font-size: 13px;
    position: relative;
    transition: background 0.2s;
}

.pointItem:hover { background: #f1f3f5; }

.point-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
}

.point-meta {
    margin-top: 4px;
    font-size: 11px;
    color: #555;
}

.action-btn {
    border: none;
    padding: 3px 6px;
    cursor: pointer;
    font-size: 10px;
    border-radius: 3px;
    margin-left: 3px;
}

.btn-edit { background: orange; color: white; }
.btn-delete { background: red; color: white; }

.coords {
    font-family: monospace;
    font-size: 10px;
    color: #777;
    margin-top: 3px;
}

.popup-form {
    min-width: 220px;
}

.popup-form label {
    font-size: 11px;
    font-weight: bold;
    display: block;
    margin-top: 4px;
}

.popup-input, .popup-textarea {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 3px;
    font-size: 12px;
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
}

.popup-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
}

.popup-advanced {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed #ddd;
    background: #fafafa;
    padding: 5px;
    border-radius: 3px;
}

.popup-textarea { height: 48px; resize: vertical; }
.popup-btn-container { margin-top: 8px; display: flex; gap: 4px; }
.popup-btn { padding: 5px 8px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 3px; border: 1px solid #ccc; }

.badge-sector {
    background: #e9ecef;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="panel">
    <h2 style="margin-top:0; margin-bottom:10px; font-size:20px; color:#333;">Zabezpieczenie Biegu</h2>

    <div style="margin-bottom: 10px;">
        <label style="font-size:12px; font-weight:bold;">Nazwa Projektu:</label>
        <input type="text" id="projectNameInput" class="popup-input" value="Katowice Night 2027 2" style="font-weight:bold; font-size:13px;" oninput="updateProjectTitle()">
    </div>

    <button class="btn-ctrl btn-danger" onclick="clearProject()">Nowy Projekt</button>
    <div class="grid-buttons" style="margin-top: 5px;">
        <button class="btn-ctrl btn-secondary" onclick="document.getElementById('jsonFileInput').click()">Import JSON</button>
        <button class="btn-ctrl btn-secondary" style="background: #4b6584;" onclick="document.getElementById('xlsxFileInput').click()">Import XLSX</button>
    </div>
    <input type="file" id="jsonFileInput" accept=".json" style="display:none;" onchange="importJSON(event)">
    <input type="file" id="xlsxFileInput" accept=".xlsx" style="display:none;" onchange="importExcel(event)">

    <div class="section-title">Trasy Biegu (Wgrywanie / Rysowanie / Eksport)</div>
    <div class="gpx-route-box">
        <!-- TRASA 5K -->
        <div class="gpx-input-row">
            <label style="color: #6f42c1;"><i class="fa-solid fa-route"></i> Trasa 5K (Fioletowa):</label>
            <div style="display:flex; gap:4px; margin-top:2px;">
                <input type="file" id="gpxFile5K" accept=".gpx" style="font-size:10px; flex:1;" onchange="loadGpxRoute('5K', this)">
                <button class="action-btn btn-main" style="background:#6f42c1; white-space:nowrap;" onclick="exportGPX('5K')" title="Pobierz tę trasę jako plik GPX"><i class="fa-solid fa-download"></i> GPX</button>
            </div>
        </div>
        <!-- TRASA 10K -->
        <div class="gpx-input-row">
            <label style="color: #b8860b;"><i class="fa-solid fa-route"></i> Trasa 10K (Żółta):</label>
            <div style="display:flex; gap:4px; margin-top:2px;">
                <input type="file" id="gpxFile10K" accept=".gpx" style="font-size:10px; flex:1;" onchange="loadGpxRoute('10K', this)">
                <button class="action-btn btn-main" style="background:#ffc107; color:#000; white-space:nowrap;" onclick="exportGPX('10K')" title="Pobierz tę trasę jako plik GPX"><i class="fa-solid fa-download"></i> GPX</button>
            </div>
        </div>
        <!-- TRASA SM -->
        <div class="gpx-input-row">
            <label style="color: #007bff;"><i class="fa-solid fa-route"></i> Trasa SM (Niebieska):</label>
            <div style="display:flex; gap:4px; margin-top:2px;">
                <input type="file" id="gpxFileSM" accept=".gpx" style="font-size:10px; flex:1;" onchange="loadGpxRoute('SM', this)">
                <button class="action-btn btn-main" style="background:#007bff; white-space:nowrap;" onclick="exportGPX('SM')" title="Pobierz tę trasę jako plik GPX"><i class="fa-solid fa-download"></i> GPX</button>
            </div>
        </div>
        <!-- TRASA HM -->
        <div class="gpx-input-row">
            <label style="color: #dc3545;"><i class="fa-solid fa-route"></i> Trasa HM (Czerwona):</label>
            <div style="display:flex; gap:4px; margin-top:2px;">
                <input type="file" id="gpxFileHM" accept=".gpx" style="font-size:10px; flex:1;" onchange="loadGpxRoute('HM', this)">
                <button class="action-btn btn-main" style="background:#dc3545; white-space:nowrap;" onclick="exportGPX('HM')" title="Pobierz tę trasę jako plik GPX"><i class="fa-solid fa-download"></i> GPX</button>
            </div>
        </div>
        <!-- TRASA UM -->
        <div class="gpx-input-row">
            <label style="color: #20c997;"><i class="fa-solid fa-route"></i> Trasa UM (Seledynowa):</label>
            <div style="display:flex; gap:4px; margin-top:2px;">
                <input type="file" id="gpxFileUM" accept=".gpx" style="font-size:10px; flex:1;" onchange="loadGpxRoute('UM', this)">
                <button class="action-btn btn-main" style="background:#20c997; white-space:nowrap;" onclick="exportGPX('UM')" title="Pobierz tę trasę jako plik GPX"><i class="fa-solid fa-download"></i> GPX</button>
            </div>
        </div>

        <hr style="border:0; border-top:1px solid #ddd; margin:8px 0;">

        <!-- MODUŁ RĘCZNEGO RYSOWANIA TRASY -->
        <label style="font-size:12px; font-weight:bold; color:#333;"><i class="fa-solid fa-pen-nib"></i> Ręczne rysowanie trasy:</label>
        <div style="margin-top:4px; display:flex; gap:4px;">
            <select id="drawRouteSelect" class="popup-input" style="margin-bottom:0; flex:1;" onchange="updateRouteDistanceUI()">
                <option value="5K">Trasa 5K</option>
                <option value="10K">Trasa 10K</option>
                <option value="SM">Trasa SM</option>
                <option value="HM">Trasa HM</option>
                <option value="UM">Trasa UM</option>
            </select>
            <button id="toggleDrawBtn" class="btn-ctrl btn-main" style="width:auto; padding:4px 8px; margin-bottom:0;" onclick="toggleDrawRouteMode()">Rysuj</button>
        </div>
        <div id="drawInfoBox" style="display:none; margin-top:6px; font-size:11px; color:#555; background:#e9ecef; padding:6px; border-radius:3px;">
            <i class="fa-solid fa-circle-info"></i> Klikaj na mapie, aby stawiać kolejne punkty trasy.<br>

            <!-- LICZNIK ODLEGLOŚCI -->
            <div id="drawDistanceText" style="margin-top:6px; font-size:12px; font-weight:bold; color:#007bff; background:#fff; padding:4px 6px; border-radius:3px; border:1px solid #ced4da;">
                <i class="fa-solid fa-ruler-horizontal"></i> Długość trasy: 0 m
            </div>

            <div style="margin-top:6px; display:flex; gap:4px;">
                <button class="action-btn btn-edit" onclick="undoLastRoutePoint()"><i class="fa-solid fa-rotate-left"></i> Cofnij punkt</button>
                <button class="action-btn btn-delete" onclick="clearActiveRoute()"><i class="fa-solid fa-trash"></i> Wyczyść trasę</button>
            </div>
        </div>
    </div>

    <div class="section-title">Tryb dodawania punktów</div>
    <div class="grid-buttons" id="modeButtons"></div>

    <div class="section-title">Eksport Danych Projektu</div>
    <div class="grid-buttons">
        <button class="btn-ctrl btn-main" onclick="exportJSON()">Eksport JSON</button>
        <button class="btn-ctrl btn-main" style="background:#1f7a3e;" onclick="exportExcel()">Eksport XLSX</button>
    </div>

    <div class="section-title">Filtrowanie warstw</div>
    <div id="filterContainer" style="max-height: 160px; overflow-y: auto; background:#f8f9fa; padding:5px; border-radius:4px; border:1px solid #ddd;"></div>

    <div class="section-title">Wyszukiwarka</div>
    <input type="text" id="searchPointInput" class="search-box" placeholder="Szukaj numeru, adresu, sektora, uwag..." oninput="searchPoints()">

    <div class="section-title">Statystyki Live</div>
    <table class="stat-table">
        <thead>
            <tr><th>Typ</th><th>Ilość</th><th>Obsada (os.)</th></tr>
        </thead>
        <tbody id="statTableBody"></tbody>
    </table>

    <div class="section-title">Lista Punktów (<span id="pointsCount">0</span>)</div>
    <div id="pointList" style="max-height:300px; overflow-y:auto; margin-top:5px;"></div>
</div>

<div id="map"></div>

<!-- Biblioteki zewnętrzne Leaflet, toGeoJSON oraz SheetJS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>

function normalizeType(typ) {
    if (typ === "Wolontariusz") return "Służba informacyjna";
    if (typ === "Ochrona") return "Służba porządkowa";
    if (typ === "Kierowanie ruchem" || typ === "Policja") return "Służba kierowania ruchem";
    if (typ === "Płoty") return "Barierki";
    if (typ === "Lider" || typ === "Koordynator" || typ === "Punkt kibicowania") return "Taśma";
    return CONFIG_TYPES[typ] ? typ : "Służba informacyjna";
}

function normalizeSector(sektor) {
    if (!sektor) return "";
    const cleaned = String(sektor).trim();
    const match = cleaned.match(/^(?:o\w*c\w*n\w*k|odc\w*|odci\w*)\s*(\d+)$/i);
    if (match) {
        return `Odcinek ${match[1]}`;
    }
    return cleaned;
}

function iconHtml(type) {
    const c = CONFIG_TYPES[type];
    return c && c.svgContent ? c.svgContent : '<i class="fa-solid fa-location-dot"></i>';
}

function badgeHtml(type) {
    const c = CONFIG_TYPES[type];
    return `<span class="custom-marker-icon type-badge ${c ? c.className : ''}">${iconHtml(type)}</span>`;
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function generateUUID() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
    }
    return 'id-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now().toString(36);
}

/* OBLICZANIE ODLEGLOŚCI TRASY */
function calculateRouteDistance(key) {
    let totalMeters = 0;

    if (routeLatLngs[key] && routeLatLngs[key].length > 1) {
        for (let i = 1; i < routeLatLngs[key].length; i++) {
            const p1 = L.latLng(routeLatLngs[key][i-1][0], routeLatLngs[key][i-1][1]);
            const p2 = L.latLng(routeLatLngs[key][i][0], routeLatLngs[key][i][1]);
            totalMeters += p1.distanceTo(p2);
        }
        return totalMeters;
    }

    const geojson = CONFIG_ROUTES[key].layer.toGeoJSON();
    if (geojson && geojson.features) {
        geojson.features.forEach(feature => {
            let coords = [];
            if (feature.geometry && feature.geometry.type === "LineString") {
                coords = feature.geometry.coordinates;
            } else if (feature.geometry && feature.geometry.type === "MultiLineString") {
                feature.geometry.coordinates.forEach(line => coords = coords.concat(line));
            }
            for (let i = 1; i < coords.length; i++) {
                const p1 = L.latLng(coords[i-1][1], coords[i-1][0]);
                const p2 = L.latLng(coords[i][1], coords[i][0]);
                totalMeters += p1.distanceTo(p2);
            }
        });
    }

    return totalMeters;
}

function formatDistanceText(meters) {
    if (meters >= 1000) {
        return (meters / 1000).toFixed(2) + " km";
    }
    return Math.round(meters) + " m";
}

function updateRouteDistanceUI() {
    const key = document.getElementById("drawRouteSelect").value;
    const distMeters = calculateRouteDistance(key);
    const textElem = document.getElementById("drawDistanceText");
    const routeCfg = CONFIG_ROUTES[key];

    if (textElem) {
        textElem.innerHTML = `<i class="fa-solid fa-ruler-horizontal" style="color:${routeCfg.color};"></i> Długość trasy (${escapeHtml(key)}): <b>${formatDistanceText(distMeters)}</b>`;
    }
}

}

function updateRouteLayer(key) {

    routeCfg.layer.clearLayers();

    if (routeLatLngs[key] && routeLatLngs[key].length > 0) {
        const polyline = L.polyline(routeLatLngs[key], {

}

function clearActiveRoute() {

    if (confirm(`Czy na pewno usunąć całą trasę ${key}?`)) {
        routeLatLngs[key] = [];
        updateRouteLayer(key);
    }
}

function extractLatLngsFromGeoJSON(geojson) {
    const coords = [];
    if (!geojson || !geojson.features) return coords;
    geojson.features.forEach(feature => {
        if (!feature.geometry) return;
        if (feature.geometry.type === "LineString") {
            feature.geometry.coordinates.forEach(c => coords.push([c[1], c[0]]));
        } else if (feature.geometry.type === "MultiLineString") {
            feature.geometry.coordinates.forEach(line => {
                line.forEach(c => coords.push([c[1], c[0]]));
            });
        }
    });
    return coords;
}

function loadGpxRoute(routeKey, inputElement) {
    const file = inputElement.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const parser = new DOMParser();
        const gpx = parser.parseFromString(event.target.result, "text/xml");
        const geojson = toGeoJSON.gpx(gpx);

        const routeCfg = CONFIG_ROUTES[routeKey];
        routeCfg.layer.clearLayers();
        routeCfg.layer.addData(geojson);
        routeLatLngs[routeKey] = extractLatLngsFromGeoJSON(geojson);

        fitMapToProjectBounds();
        updateRouteDistanceUI();
    };
    reader.readAsText(file);
}

/* EKSPORT TRASY DO PLIKU GPX */
function exportGPX(routeKey) {
    let coords = [];

    if (routeLatLngs[routeKey] && routeLatLngs[routeKey].length > 0) {
        coords = routeLatLngs[routeKey];
    } else {
        coords = extractLatLngsFromGeoJSON(CONFIG_ROUTES[routeKey].layer.toGeoJSON());
    }

    if (coords.length === 0) {
        alert(`Brak narysowanej lub zaimportowanej trasy dla typu: ${routeKey}`);
        return;
    }

    let gpxContent = `<?xml version="1.0" encoding="UTF-8"?>\n`;
    gpxContent += `<gpx version="1.1" creator="System Zabezpieczenia Biegu" xmlns="http://www.topografix.com/GPX/1/1">\n`;
    gpxContent += `  <trk>\n`;
    gpxContent += `    <name>Trasa ${escapeHtml(routeKey)} - ${escapeHtml(projectName)}</name>\n`;
    gpxContent += `    <trkseg>\n`;

    coords.forEach(pt => {
        gpxContent += `      <trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>\n`;
    });

    gpxContent += `    </trkseg>\n`;
    gpxContent += `  </trk>\n`;
    gpxContent += `</gpx>`;

    const blob = new Blob([gpxContent], { type: 'application/gpx+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const downloadAnchor = document.createElement("a");
    downloadAnchor.href = url;
    downloadAnchor.download = `${(projectName || "projekt").toLowerCase().replace(/\s+/g, '_')}_trasa_${routeKey}.gpx`;
    downloadAnchor.click();
    URL.revokeObjectURL(url);
}

function fitMapToProjectBounds() {
    const bounds = L.latLngBounds([]);
    let hasData = false;

    Object.keys(CONFIG_ROUTES).forEach(key => {
        const layer = CONFIG_ROUTES[key].layer;
        if (layer.getLayers().length > 0 && layer.getBounds().isValid()) {
            bounds.extend(layer.getBounds());
            hasData = true;
        }
    });

    points.forEach(p => {
        if (!Number.isNaN(p.lat) && !Number.isNaN(p.lng)) {
            bounds.extend([p.lat, p.lng]);
            hasData = true;
        }
    });

    if (hasData && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [30, 30] });
    }
}

/* NUMERACJA I TWORZENIE PUNKTÓW */
function generateNextNumber(type) {
    const cfg = CONFIG_TYPES[type] || { prefix: "PNK" };
    const prefix = cfg.prefix;
    let maxNum = 0;

    points.forEach(p => {
        if (p.typ === type && typeof p.numer === "string") {
            const match = p.numer.match(new RegExp(`^${prefix}-(\\d+)$`, "i"));
            if (match) {
                const val = parseInt(match[1], 10);
                if (val > maxNum) maxNum = val;
            }
        }
    });

    return `${prefix}-${String(maxNum + 1).padStart(3, "0")}`;
}

function createMarkerIcon(type) {
    const cfg = CONFIG_TYPES[type] || {};
    return L.divIcon({
        className: `custom-marker-icon ${cfg.className || ""}`,
        html: iconHtml(type),
        iconSize: [26, 26],
        iconAnchor: [13, 13],
        popupAnchor: [0, -13]
    });
}

function parseOptionalNumber(val) {
    if (val === undefined || val === null) return undefined;
    const str = String(val).trim();
    if (str === "") return undefined;
    const num = Number(str);
    return Number.isFinite(num) && !Number.isNaN(num) ? num : undefined;
}

            <div style="display:flex; align-items:center; margin-bottom:4px;">
                ${badgeHtml(point.typ)}
                <strong style="font-size:13px;">${escapeHtml(point.numer)}</strong>
            </div>
            <label>Numer punktu</label>
            <input type="text" class="popup-input pf-numer" value="${escapeHtml(point.numer)}">

            <label>Sektor / Odcinek</label>

            <label>Uwagi</label>
            <textarea class="popup-textarea pf-uwagi">${escapeHtml(point.uwagi)}</textarea>

            <div class="popup-advanced">
                <div style="font-size:10px; font-weight:bold; color:#666; margin-bottom:2px;">Parametry orientacji / przesunięcia (JSON)</div>
                <div class="popup-row-3">
                    <div>
                        <label style="margin-top:0; font-size:10px;">Kąt (kat)</label>
                        <input type="number" step="any" class="popup-input pf-kat" value="${escapeHtml(katVal)}" placeholder="np. 65">
                    </div>
                    <div>
                        <label style="margin-top:0; font-size:10px;">Przes. X</label>
                        <input type="number" step="any" class="popup-input pf-dx" value="${escapeHtml(dxVal)}" placeholder="X">
                    </div>
                    <div>
                        <label style="margin-top:0; font-size:10px;">Przes. Y</label>
                        <input type="number" step="any" class="popup-input pf-dy" value="${escapeHtml(dyVal)}" placeholder="Y">
                    </div>
                </div>
            </div>

            <div class="coords">Lat: ${Number(point.lat).toFixed(6)}, Lng: ${Number(point.lng).toFixed(6)}</div>

            <div class="popup-btn-container">
                <button type="button" class="popup-btn btn-main pf-save" style="flex:1;">Zapisz</button>
                <button type="button" class="popup-btn btn-danger pf-remove">Usuń</button>
            </div>
        </div>
    `;
}

function attachPopupEvents(point) {
    point.marker.on("popupopen", e => {
        const container = e.popup.getElement();
        if (!container) return;

        const saveBtn = container.querySelector(".pf-save");
        const removeBtn = container.querySelector(".pf-remove");

        if (saveBtn) {
            saveBtn.onclick = () => {
                const newNumer = container.querySelector(".pf-numer").value.trim() || point.numer;
                const newTyp = normalizeType(container.querySelector(".pf-typ").value);
                const newSektor = normalizeSector(container.querySelector(".pf-sektor").value.trim());
                const parsedOsoby = parseInt(container.querySelector(".pf-liczba-osob").value, 10);
                const newLiczbaOsob = Number.isNaN(parsedOsoby) || parsedOsoby < 0 ? 0 : parsedOsoby;
                const newTelefon = container.querySelector(".pf-telefon").value.trim();
                const newAdres = container.querySelector(".pf-adres").value.trim();
                const newUwagi = container.querySelector(".pf-uwagi").value;

                const newKat = parseOptionalNumber(container.querySelector(".pf-kat").value);
                const newDx = parseOptionalNumber(container.querySelector(".pf-dx").value);
                const newDy = parseOptionalNumber(container.querySelector(".pf-dy").value);

                point.numer = newNumer;
                point.typ = newTyp;
                point.sektor = newSektor;
                point.liczba_osob = newLiczbaOsob;
                point.telefon = newTelefon;
                point.adres = newAdres;
                point.uwagi = newUwagi;

                if (newKat !== undefined) point.kat = newKat;
                else delete point.kat;

                if (newDx !== undefined) point.przesuniecieX = newDx;
                else delete point.przesuniecieX;

                if (newDy !== undefined) point.przesuniecieY = newDy;
                else delete point.przesuniecieY;

                point.marker.setIcon(createMarkerIcon(point.typ));
                point.marker.setPopupContent(buildPopupHtml(point));
                applyPointFilterVisibility(point);
                refreshList();
                updateStats();
            };
        }

        if (removeBtn) {
            removeBtn.onclick = () => {
                deletePoint(point.id);
            };
        }
    });
}

function applyPointFilterVisibility(point) {
    const visible = activeFilters[point.typ] !== false;
    if (visible) {
        if (!map.hasLayer(point.marker)) point.marker.addTo(map);
    } else {
        if (map.hasLayer(point.marker)) map.removeLayer(point.marker);
    }
}

function addPoint(lat, lng, type, customData = {}, openPopupAfter = true) {
    const cleanType = normalizeType(type);
    const rawStaff = customData.liczba_osob ?? customData.obsada ?? 1;
    const parsedStaff = parseInt(rawStaff, 10);

    const kat = parseOptionalNumber(customData.kat);
    const dx = parseOptionalNumber(customData.przesuniecieX);
    const dy = parseOptionalNumber(customData.przesuniecieY);

    const point = {
        id: customData.id || generateUUID(),
        numer: customData.numer || generateNextNumber(cleanType),
        typ: cleanType,
        sektor: normalizeSector(customData.sektor || ""),
        liczba_osob: Number.isFinite(parsedStaff) && !Number.isNaN(parsedStaff) ? Math.max(0, parsedStaff) : 1,
        telefon: customData.telefon ?? "",
        adres: customData.adres ?? customData.nazwa ?? "",
        uwagi: customData.uwagi ?? "",
        lat: Number(lat),
        lng: Number(lng),
        ...(kat !== undefined ? { kat } : {}),
        ...(dx !== undefined ? { przesuniecieX: dx } : {}),
        ...(dy !== undefined ? { przesuniecieY: dy } : {}),
        marker: null
    };

    const marker = L.marker([point.lat, point.lng], {
        icon: createMarkerIcon(point.typ),
        draggable: true
    });

    marker.bindPopup(() => buildPopupHtml(point));

    marker.on("dragend", () => {
        const pos = marker.getLatLng();
        point.lat = pos.lat;
        point.lng = pos.lng;
        if (marker.isPopupOpen()) {
            marker.setPopupContent(buildPopupHtml(point));
        }
        refreshList();
    });

    point.marker = marker;
    attachPopupEvents(point);
    points.push(point);

    applyPointFilterVisibility(point);
    refreshList();
    updateStats();

    if (openPopupAfter && activeFilters[point.typ] !== false) {
        marker.openPopup();
    }

    return point;
}

function deletePoint(pointId) {
    const idx = points.findIndex(p => p.id === pointId);
    if (idx === -1) return;

    const pt = points[idx];
    if (pt.marker && map.hasLayer(pt.marker)) {
        map.removeLayer(pt.marker);
    }
    points.splice(idx, 1);
    refreshList();
    updateStats();
}

function focusPoint(pointId) {
    const pt = points.find(p => p.id === pointId);
    if (!pt) return;

    if (activeFilters[pt.typ] === false) {
        activeFilters[pt.typ] = true;
        const cbId = `filter_${pt.typ.replace(/\s+/g, '_')}`;
        const cb = document.getElementById(cbId);
        if (cb) cb.checked = true;
        applyPointFilterVisibility(pt);
        updateStats();
    }

    map.setView([pt.lat, pt.lng], Math.max(map.getZoom(), 16));
    if (!map.hasLayer(pt.marker)) {
        pt.marker.addTo(map);
    }
    pt.marker.openPopup();
}

/* OBSŁUGA KLIKNIĘĆ NA MAPIE */
map.on("click", e => {
    const { lat, lng } = e.latlng;

    if (isDrawingRoute) {
        const key = document.getElementById("drawRouteSelect").value;
        routeLatLngs[key].push([lat, lng]);
        updateRouteLayer(key);
        return;
    }

    if (currentMode) {
        addPoint(lat, lng, currentMode, {}, true);
    }
});

/* STATYSTYKI, WYSZUKIWARKA I LISTA PUNKTÓW */
function updateStats() {
    const tbody = document.getElementById("statTableBody");
    const totals = {};
    let grandCount = 0;
    let grandStaff = 0;

    Object.keys(CONFIG_TYPES).forEach(t => {
        totals[t] = { count: 0, staff: 0 };
    });

    points.forEach(p => {
        const t = normalizeType(p.typ);
        if (!totals[t]) totals[t] = { count: 0, staff: 0 };
        const staffVal = Number(p.liczba_osob) || 0;
        totals[t].count += 1;
        totals[t].staff += staffVal;
        grandCount += 1;
        grandStaff += staffVal;
    });

    let html = Object.keys(CONFIG_TYPES).map(t => `
        <tr>
            <td>${badgeHtml(t)}<span>${escapeHtml(t)}</span></td>
            <td><b>${totals[t].count}</b></td>
            <td><b>${totals[t].staff}</b></td>
        </tr>
    `).join("");

    html += `
        <tr style="background:#f1f3f5; font-weight:bold;">
            <td>RAZEM</td>
            <td>${grandCount}</td>
            <td>${grandStaff}</td>
        </tr>
    `;

    tbody.innerHTML = html;
}

function searchPoints() {
    refreshList();
}

function refreshList() {
    const listEl = document.getElementById("pointList");
    const countEl = document.getElementById("pointsCount");
    const query = (document.getElementById("searchPointInput").value || "").trim().toLowerCase();

    const filtered = points.filter(p => {
        if (activeFilters[p.typ] === false) return false;
        if (!query) return true;
        const haystack = `${p.numer} ${p.typ} ${p.sektor} ${p.adres} ${p.telefon} ${p.uwagi}`.toLowerCase();
        return haystack.includes(query);
    });

    countEl.textContent = filtered.length;

    if (filtered.length === 0) {
        listEl.innerHTML = `<div style="font-size:12px; color:#777; padding:6px;">Brak punktów spełniających kryteria.</div>`;
        return;
    }

    listEl.innerHTML = "";
    filtered.forEach(p => {
        const item = document.createElement("div");
        item.className = "pointItem";
        item.innerHTML = `
            <div class="point-header">
                <div style="display:flex; align-items:center; min-width:0;">
                    ${badgeHtml(p.typ)}
                    <strong style="white-space:nowrap;">${escapeHtml(p.numer)}</strong>
                    ${p.adres ? `<span style="margin-left:5px; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">— ${escapeHtml(p.adres)}</span>` : ""}
                </div>
                <div style="flex-shrink:0;">
                    <button type="button" class="action-btn btn-edit" title="Edytuj punkt">Edytuj</button>
                    <button type="button" class="action-btn btn-delete" title="Usuń punkt">X</button>
                </div>
            </div>
            <div class="point-meta">
                <span>${escapeHtml(p.typ)}</span>
                ${p.sektor ? `<span class="badge-sector" style="margin-left:4px;">${escapeHtml(p.sektor)}</span>` : ""}
                <span style="margin-left:6px;"><i class="fa-solid fa-users"></i> <b>${Number(p.liczba_osob) || 0}</b></span>
                ${p.telefon ? `<span style="margin-left:6px;"><i class="fa-solid fa-phone"></i> ${escapeHtml(p.telefon)}</span>` : ""}
                ${p.kat !== undefined ? `<span style="margin-left:6px; color:#666;">kąt: ${escapeHtml(p.kat)}°</span>` : ""}
            </div>
            ${p.uwagi ? `<div style="font-size:11px; color:#666; margin-top:3px;">${escapeHtml(p.uwagi)}</div>` : ""}
            <div class="coords">${Number(p.lat).toFixed(5)}, ${Number(p.lng).toFixed(5)}</div>
        `;

        item.addEventListener("click", () => focusPoint(p.id));

        const editBtn = item.querySelector(".btn-edit");
        editBtn.addEventListener("click", ev => {
            ev.stopPropagation();
            focusPoint(p.id);
        });

        const delBtn = item.querySelector(".btn-delete");
        delBtn.addEventListener("click", ev => {
            ev.stopPropagation();
            if (confirm(`Usunąć punkt ${p.numer}?`)) {
                deletePoint(p.id);
            }
        });

        listEl.appendChild(item);
    });
}

/* ZARZĄDZANIE PROJEKTEM ORAZ IMPORT / EKSPORT JSON I XLSX */
function clearProject() {
    if (!confirm("Wyczyścić bieżący projekt (wszystkie punkty i trasy)?")) return;

    points.forEach(p => {
        if (p.marker && map.hasLayer(p.marker)) map.removeLayer(p.marker);
    });
    points = [];

    Object.keys(CONFIG_ROUTES).forEach(key => {
        routeLatLngs[key] = [];
        CONFIG_ROUTES[key].layer.clearLayers();
    });

    currentMode = null;
    if (isDrawingRoute) toggleDrawRouteMode();
    document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
    document.getElementById("searchPointInput").value = "";

    refreshList();
    updateStats();
    updateRouteDistanceUI();
}

function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

function exportJSON() {
    const payload = {
        projectName: projectName,
        generatedAt: new Date().toISOString(),
        drawnRoutes: {
            "5K": Array.isArray(routeLatLngs["5K"]) ? routeLatLngs["5K"] : [],
            "10K": Array.isArray(routeLatLngs["10K"]) ? routeLatLngs["10K"] : [],
            "SM": Array.isArray(routeLatLngs["SM"]) ? routeLatLngs["SM"] : [],
            "HM": Array.isArray(routeLatLngs["HM"]) ? routeLatLngs["HM"] : [],
            "UM": Array.isArray(routeLatLngs["UM"]) ? routeLatLngs["UM"] : []
        },
        points: points.map(p => {
            const exportedPoint = {
                typ: p.typ,
                numer: p.numer,
                sektor: p.sektor,
                liczba_osob: Number(p.liczba_osob) || 0,
                telefon: p.telefon || "",
                uwagi: p.uwagi || "",
                lat: p.lat,
                lng: p.lng
            };
            if (p.adres) exportedPoint.adres = p.adres;
            if (p.kat !== undefined) exportedPoint.kat = p.kat;
            if (p.przesuniecieX !== undefined) exportedPoint.przesuniecieX = p.przesuniecieX;
            if (p.przesuniecieY !== undefined) exportedPoint.przesuniecieY = p.przesuniecieY;
            return exportedPoint;
        })
    };

    const safeName = (projectName || "projekt").toLowerCase().replace(/\s+/g, "_");
    downloadFile(JSON.stringify(payload, null, 2), `${safeName}_punkty_zaktualizowane.json`, "application/json;charset=utf-8");
}

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);

            points.forEach(p => {
                if (p.marker && map.hasLayer(p.marker)) map.removeLayer(p.marker);
            });
            points = [];

            if (data.projectName) {
                projectName = String(data.projectName);
                document.getElementById("projectNameInput").value = projectName;
            }

            Object.keys(CONFIG_ROUTES).forEach(key => {
                routeLatLngs[key] = [];
                CONFIG_ROUTES[key].layer.clearLayers();
            });

            const incomingRoutes = data.drawnRoutes || data.routes;
            if (incomingRoutes && typeof incomingRoutes === "object") {
                Object.keys(CONFIG_ROUTES).forEach(key => {
                    if (Array.isArray(incomingRoutes[key])) {
                        routeLatLngs[key] = incomingRoutes[key]
                            .filter(pt => Array.isArray(pt) && pt.length >= 2 && !Number.isNaN(Number(pt[0])) && !Number.isNaN(Number(pt[1])))
                            .map(pt => [Number(pt[0]), Number(pt[1])]);
                        updateRouteLayer(key);
                    }
                });
            }

            if (Array.isArray(data.points)) {
                data.points.forEach(pt => {
                    if (pt && !Number.isNaN(Number(pt.lat)) && !Number.isNaN(Number(pt.lng))) {
                        addPoint(Number(pt.lat), Number(pt.lng), pt.typ, pt, false);
                    }
                });
            }

            fitMapToProjectBounds();
            refreshList();
            updateStats();
            updateRouteDistanceUI();
        } catch (err) {
            alert("Błąd podczas odczytu pliku JSON: " + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = "";
}

function exportExcel() {
    if (typeof XLSX === "undefined") {
        alert("Biblioteka SheetJS (XLSX) nie została załadowana.");
        return;
    }

    const rows = points.map(p => ({
        "Numer": p.numer,
        "Typ": p.typ,
        "Sektor": p.sektor,
        "Liczba osób": Number(p.liczba_osob) || 0,
        "Telefon": p.telefon || "",
        "Adres": p.adres || "",
        "Uwagi": p.uwagi || "",
        "Kąt": p.kat ?? "",
        "Przesunięcie X": p.przesuniecieX ?? "",
        "Przesunięcie Y": p.przesuniecieY ?? "",
        "Szerokość (lat)": Number(p.lat),
        "Długość (lng)": Number(p.lng)
    }));

    const wsPoints = XLSX.utils.json_to_sheet(rows.length ? rows : [{
        "Numer": "", "Typ": "", "Sektor": "", "Liczba osób": 0, "Telefon": "", "Adres": "", "Uwagi": "", "Kąt": "", "Przesunięcie X": "", "Przesunięcie Y": "", "Szerokość (lat)": "", "Długość (lng)": ""
    }]);

    const statRows = Object.keys(CONFIG_TYPES).map(t => {
        const matching = points.filter(p => p.typ === t);
        return {
            "Typ": t,
            "Ilość": matching.length,
            "Obsada (os.)": matching.reduce((acc, p) => acc + (Number(p.liczba_osob) || 0), 0)
        };
    });
    const wsStats = XLSX.utils.json_to_sheet(statRows);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsPoints, "Punkty");
    XLSX.utils.book_append_sheet(wb, wsStats, "Statystyki");

    const safeName = (projectName || "projekt").toLowerCase().replace(/\s+/g, "_");
    XLSX.writeFile(wb, `${safeName}_zabezpieczenie.xlsx`);
}

function importExcel(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (typeof XLSX === "undefined") {
        alert("Biblioteka SheetJS (XLSX) nie została załadowana.");
        return;
    }

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonRows = XLSX.utils.sheet_to_json(worksheet);

            points.forEach(p => {
                if (p.marker && map.hasLayer(p.marker)) map.removeLayer(p.marker);
            });
            points = [];

            jsonRows.forEach(row => {
                const lat = Number(row["Szerokość (lat)"] ?? row["Lat"] ?? row["lat"]);
                const lng = Number(row["Długość (lng)"] ?? row["Lng"] ?? row["lng"]);
                if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                const rawType = row["Typ"] ?? row["typ"] ?? "Służba informacyjna";
                const obsVal = parseInt(row["Liczba osób"] ?? row["Obsada"] ?? row["Obsada (os.)"] ?? row["liczba_osob"] ?? 1, 10);

                addPoint(lat, lng, rawType, {
                    numer: row["Numer"] ?? row["numer"] ?? "",
                    sektor: row["Sektor"] ?? row["sektor"] ?? "",
                    liczba_osob: Number.isNaN(obsVal) ? 1 : obsVal,
                    telefon: row["Telefon"] ?? row["telefon"] ?? "",
                    adres: row["Adres"] ?? row["adres"] ?? row["Nazwa"] ?? "",
                    uwagi: row["Uwagi"] ?? row["uwagi"] ?? "",
                    kat: row["Kąt"] ?? row["kat"],
                    przesuniecieX: row["Przesunięcie X"] ?? row["przesuniecieX"],
                    przesuniecieY: row["Przesunięcie Y"] ?? row["przesuniecieY"]
                }, false);
            });

            fitMapToProjectBounds();
            refreshList();
            updateStats();
        } catch (err) {
            alert("Błąd podczas importu pliku XLSX: " + err.message);
        }
    };
    reader.readAsArrayBuffer(file);
    event.target.value = "";
}

// Inicjalizacja pustych tabel i liczników
updateStats();
refreshList();
updateRouteDistanceUI();
</script>
